[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "gold-trading-bot3"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["alpaca-py>=0.42,<1", "pandas>=2.2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
[project.scripts]
gold-bot = "gold_bot.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

